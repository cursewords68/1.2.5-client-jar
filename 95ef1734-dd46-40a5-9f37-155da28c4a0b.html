    flex-direction:column;
}

button{

    background:#161616;

    padding:12px 14px;
    margin-bottom:10px;
    cursor:pointer;
    font-size:13px;
}

button:hover{
    background:#202020;
    border-color:#555;
}

button:active{
    background:#111;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.section{
    margin-bottom:22px;
}

.section-title{
    color:#777;
    text-transform:uppercase;
    font-size:10px;
    letter-spacing:1px;
    margin-bottom:9px;
}

.stat{
    border:1px solid #252525;
    background:#111;
    padding:10px;
    margin-bottom:6px;
    font-size:12px;
}

.stat b{
    color:#eee;
}

#screen{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    overflow:hidden;
}

#canvas{
    image-rendering:auto;
    max-width:100%;
    max-height:100%;
}

#console{
    height:185px;
    overflow:auto;
    border-top:1px solid #292929;
    background:#080808;
    padding:10px 13px;
    font-family:monospace;
    font-size:11px;
    line-height:1.55;
    color:#aaa;
}

.log-info{color:#aaa}
.log-ok{color:#9bd18b}
.log-warn{color:#d9bb72}
.log-error{color:#e27b7b}

#drop{
    border:1px dashed #383838;
    padding:20px 10px;
    text-align:center;
    color:#777;
    font-size:12px;
    margin-bottom:12px;
}

#drop.drag{
    border-color:#aaa;
    color:#eee;
}

#file{
    display:none;
}

#launch{
    background:#eee;
    color:#090909;
    border-color:#eee;
    font-weight:bold;
}

#launch:hover{
    background:#fff;
}

#progress{
    height:3px;
    width:100%;
    background:#171717;
}

#progressbar{
    width:0%;
    height:100%;
    background:#eee;
    transition:width .15s linear;
}

#overlay{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000;
    z-index:10;
}

#overlay.visible{
    display:flex;
}

#mojang{

    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
    background:#000;

    letter-spacing:-4px;

#mojangSub{

    color:#aaa;
    font-size:13px;
    letter-spacing:1px;
}

#loadingBar{
    width:min(360px,65%);
    height:5px;
    background:#222;
    margin-top:25px;
}

#loadingFill{
    width:0%;
    height:100%;
    background:#fff;
}

    #content{
        grid-template-columns:1fr;
    }

    #sidebar{
        border-right:0;
        border-bottom:1px solid #292929;
        max-height:220px;
    }

<script>
"use strict";

/* =========================================================
   Utilities
========================================================= */

const $ = id => document.getElementById(id);

function log(message,type="info"){
    const line=document.createElement("div");
    line.className="log-"+type;
    line.textContent="["+new Date().toLocaleTimeString()+"] "+message;
    $("console").appendChild(line);
    $("console").scrollTop=$("console").scrollHeight;
}

function progress(value){
    $("progressbar").style.width=Math.max(0,Math.min(100,value))+"%";
}

function sleep(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
}

function u8(buffer){
    if(buffer instanceof Uint8Array) return buffer;

    if(buffer instanceof ArrayBuffer)
        return new Uint8Array(buffer);

    if(ArrayBuffer.isView(buffer))
        return new Uint8Array(
            buffer.buffer,
            buffer.byteOffset,
            buffer.byteLength
        );

    throw new Error("Expected binary data");
}

function exactBuffer(data){
    const b=u8(data);

    return b.buffer.slice(
        b.byteOffset,
        b.byteOffset+b.byteLength
    );
}

/* =========================================================
   Binary reader
========================================================= */

class Reader{

    constructor(data){

        const buffer=exactBuffer(data);

        this.buffer=buffer;
        this.bytes=new Uint8Array(buffer);
        this.view=new DataView(buffer);
        this.pos=0;
    }

    remaining(){
        return this.bytes.length-this.pos;
    }

    need(n){
        if(this.pos+n>this.bytes.length)
            throw new Error(
                "Unexpected end of class file at "+this.pos
            );
    }

    u1(){
        this.need(1);
        return this.view.getUint8(this.pos++);
    }

    u2(){
        this.need(2);
        const v=this.view.getUint16(this.pos,false);
        this.pos+=2;
        return v;
    }

    u4(){
        this.need(4);
        const v=this.view.getUint32(this.pos,false);
        this.pos+=4;
        return v;
    }

    i4(){
        this.need(4);
        const v=this.view.getInt32(this.pos,false);
        this.pos+=4;
        return v;
    }

    bytesN(n){
        this.need(n);
        const out=this.bytes.slice(this.pos,this.pos+n);
        this.pos+=n;
        return out;
    }

    skip(n){
        this.need(n);
        this.pos+=n;
    }
}

/* =========================================================
   Class file parser
========================================================= */

function utf8(bytes){

    return new TextDecoder("utf-8").decode(bytes);
}

function parseClass(input){

    const r=new Reader(input);

    const magic=r.u4();

    if(magic!==0xCAFEBABE)
        throw new Error("Invalid class magic");

    const minor=r.u2();
    const major=r.u2();

    const cpCount=r.u2();

    const cp=new Array(cpCount);

    for(let i=1;i<cpCount;i++){

        const tag=r.u1();

        switch(tag){

            case 1:{
                const len=r.u2();
                const raw=r.bytesN(len);

                cp[i]={
                    tag,
                    value:utf8(raw)
                };
                break;
            }

            case 3:
                cp[i]={
                    tag,
                    value:r.i4()
                };
                break;

            case 4:{
                const bits=r.u4();

                const f=new DataView(
                    new Uint8Array([
                        bits>>>24,
                        bits>>>16&255,
                        bits>>>8&255,
                        bits&255
                    ]).buffer
                ).getFloat32(0,false);

                cp[i]={
                    tag,
                    value:f
                };
                break;
            }

            case 5:{
                const hi=r.u4();
                const lo=r.u4();

                cp[i]={
                    tag,
                    hi,
                    lo
                };

                i++;
                break;
            }

            case 6:{
                const hi=r.u4();
                const lo=r.u4();

                cp[i]={
                    tag,
                    hi,
                    lo
                };

                i++;
                break;
            }

            case 7:
                cp[i]={
                    tag,
                    nameIndex:r.u2()
                };
                break;

            case 8:
                cp[i]={
                    tag,
                    stringIndex:r.u2()
                };
                break;

            case 9:
            case 10:
            case 11:
            case 12:
            case 18:
                cp[i]={
                    tag,
                    a:r.u2(),
                    b:r.u2()
                };
                break;

            case 15:
                cp[i]={
                    tag,
                    refKind:r.u1(),
                    refIndex:r.u2()
                };
                break;

            case 16:
                cp[i]={
                    tag,
                    descriptorIndex:r.u2()
                };
                break;

            default:
                throw new Error(
                    "Unknown constant-pool tag "+tag+
                    " at index "+i
                );
        }
    }

    const accessFlags=r.u2();

    const thisClass=r.u2();
    const superClass=r.u2();

    function cpUtf(index){

        const e=cp[index];

        if(!e)
            return "";

        if(e.tag===1)
            return e.value;

        if(e.tag===7)
            return cpUtf(e.nameIndex);

        if(e.tag===8)
            return cpUtf(e.stringIndex);

        return "";
    }

    function className(index){
        return cpUtf(index);
    }

    const interfacesCount=r.u2();

    const interfaces=[];

    for(let i=0;i<interfacesCount;i++)
        interfaces.push(className(r.u2()));

    function readAttributes(){

        const count=r.u2();
        const attrs=[];

        for(let i=0;i<count;i++){

            const name=cpUtf(r.u2());
            const length=r.u4();

            const start=r.pos;

            let value=null;

            if(name==="Code"){

                const maxStack=r.u2();
                const maxLocals=r.u2();

                const codeLength=r.u4();
                const code=r.bytesN(codeLength);

                const exceptionCount=r.u2();

                const exceptions=[];

                for(let j=0;j<exceptionCount;j++){

                    exceptions.push({
                        start:r.u2(),
                        end:r.u2(),
                        handler:r.u2(),
                        catchType:r.u2()
                    });
                }

                const nested=readAttributes();

                value={
                    maxStack,
                    maxLocals,
                    code,
                    exceptions,
                    attributes:nested
                };

            }else if(name==="ConstantValue"){

                value={
                    constant:r.u2()
                };

            }else if(
                name==="SourceFile"
            ){

                value={
                    sourceFile:cpUtf(r.u2())
                };

            }else if(
                name==="LineNumberTable"
            ){

                const count2=r.u2();
                const lines=[];

                for(let j=0;j<count2;j++){

                    lines.push({
                        start:r.u2(),
                        line:r.u2()
                    });
                }

                value={lines};

            }else{

                value=r.bytesN(length);
            }

            const consumed=r.pos-start;

            if(consumed<length)
                r.skip(length-consumed);

            attrs.push({
                name,
                length,
                value
            });
        }

        return attrs;
    }

    const fieldCount=r.u2();
    const fields=[];

    for(let i=0;i<fieldCount;i++){

        const flags=r.u2();
        const name=cpUtf(r.u2());
        const descriptor=cpUtf(r.u2());

        fields.push({
            flags,
            name,
            descriptor,
            attributes:readAttributes()
        });
    }

    const methodCount=r.u2();
    const methods=[];

    for(let i=0;i<methodCount;i++){

        const flags=r.u2();
        const name=cpUtf(r.u2());
        const descriptor=cpUtf(r.u2());

        methods.push({
            flags,
            name,
            descriptor,
            attributes:readAttributes()
        });
    }

    const attributes=readAttributes();

    return {
        minor,
        major,
        accessFlags,

        name:className(thisClass),
        superName:superClass ? className(superClass) : null,

        interfaces,

        constantPool:cp,

        fields,
        methods,
        attributes
    };
}

/* =========================================================
   ZIP/JAR reader
========================================================= */

function readU16(view,pos){
    return view.getUint16(pos,true);
}

function readU32(view,pos){
    return view.getUint32(pos,true);
}

function findEOCD(bytes){

    const max=Math.max(
        0,
        bytes.length-65557
    );

    for(let i=bytes.length-22;i>=max;i--){

        if(
            bytes[i]===0x50 &&
            bytes[i+1]===0x4b &&
            bytes[i+2]===0x05 &&
            bytes[i+3]===0x06
        ){
            return i;
        }
    }

    return -1;
}

async function inflateRaw(data){

    if(typeof DecompressionStream==="undefined")
        throw new Error(
            "This browser does not provide DecompressionStream"
        );

    const stream=new Blob([data])
        .stream()
        .pipeThrough(
            new DecompressionStream("deflate-raw")
        );

    return new Uint8Array(
        await new Response(stream).arrayBuffer()
    );
}

async function openJar(buffer){

    const bytes=u8(buffer);
    const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);

    const eocd=findEOCD(bytes);

    if(eocd<0)
        throw new Error("ZIP end-of-central-directory not found");

    const entryCount=readU16(view,eocd+10);
    const centralSize=readU32(view,eocd+12);
    const centralOffset=readU32(view,eocd+16);

    const files=new Map();

    let p=centralOffset;

    for(let i=0;i<entryCount;i++){

        if(readU32(view,p)!==0x02014b50)
            throw new Error(
                "Invalid central directory entry "+i
            );

        const compression=readU16(view,p+10);
        const compressedSize=readU32(view,p+20);
        const uncompressedSize=readU32(view,p+24);

        const nameLen=readU16(view,p+28);
        const extraLen=readU16(view,p+30);
        const commentLen=readU16(view,p+32);

        const localOffset=readU32(view,p+42);

        const name=utf8(
            bytes.slice(
                p+46,
                p+46+nameLen
            )
        );

        files.set(name,{
            name,
            compression,
            compressedSize,
            uncompressedSize,
            localOffset
        });

        p+=46+nameLen+extraLen+commentLen;
    }

    async function extract(name){

        const file=files.get(name);

        if(!file)
            throw new Error(
                "JAR entry not found: "+name
            );

        const lp=file.localOffset;

        if(readU32(view,lp)!==0x04034b50)
            throw new Error(
                "Invalid local file header: "+name
            );

        const nameLen=readU16(view,lp+26);
        const extraLen=readU16(view,lp+28);

        const dataStart=
            lp+30+nameLen+extraLen;

        const compressed=bytes.slice(
            dataStart,
            dataStart+file.compressedSize
        );

        if(file.compression===0)
            return exactBuffer(compressed);

        if(file.compression===8){

            const inflated=await inflateRaw(compressed);

            return exactBuffer(inflated);
        }

        throw new Error(
            "Unsupported ZIP compression "+file.compression+
            " for "+name
        );
    }

    return {
        files,
        extract,
        entryCount,
        centralSize
    };
}

/* =========================================================
   JVM values
========================================================= */

class JVMObject{

    constructor(className){

        this.className=className;
        this.fields=new Map();
    }
}

class JVMArray{

    constructor(type,length){

        this.type=type;
        this.values=new Array(length).fill(null);
    }
}

class JVMClass{

    constructor(definition){

        this.definition=definition;
        this.staticFields=new Map();
        this.initialized=false;
        this.initializing=false;
    }
}

/* =========================================================
   JVM descriptor parser
========================================================= */

function parseMethodDescriptor(desc){

    let p=0;

    if(desc[p]!=="(")
        throw new Error("Bad method descriptor: "+desc);

    p++;

    const args=[];

    while(desc[p]!==")"){

        const result=parseType(desc,p);

        args.push(result.type);
        p=result.pos;
    }

    p++;

    const result=parseType(desc,p);

    return {
        args,
        returnType:result.type
    };
}

function parseType(desc,pos){

    let c=desc[pos];

    if(c==="V")
        return {type:"void",pos:pos+1};

    if(
        c==="I" ||
        c==="Z" ||
        c==="B" ||
        c==="C" ||
        c==="S"
    )
        return {type:"int",pos:pos+1};

    if(c==="F")
        return {type:"float",pos:pos+1};

    if(c==="J")
        return {type:"long",pos:pos+1};

    if(c==="D")
        return {type:"double",pos:pos+1};

    if(c==="L"){

        const end=desc.indexOf(";",pos);

        return {
            type:{
                kind:"object",
                name:desc.slice(pos+1,end)
            },
            pos:end+1
        };
    }

    if(c==="["){

        const r=parseType(desc,pos+1);

        return {
            type:{
                kind:"array",
                component:r.type
            },
            pos:r.pos
        };
    }

    throw new Error(
        "Unknown descriptor type "+c
    );
}

/* =========================================================
   JVM interpreter
========================================================= */

class JVM{

    constructor(){

        this.classes=new Map();

        this.executedMethods=0;

        this.maxInstructions=3000000;

        this.instructionCounter=0;

        this.mainClass=null;

        this.nativeMethods=new Map();

        this.registerNatives();
    }

    addClass(definition){

        this.classes.set(
            definition.name,
            new JVMClass(definition)
        );
    }

    getClass(name){

        if(this.classes.has(name))
            return this.classes.get(name);

        return null;
    }

    registerNatives(){

        /*
         * Basic Java runtime shims.
         *
         * These are intentionally kept here rather than
         * generating fake WASM. More native methods can be
         * implemented as Minecraft initialization reaches them.
         */

        this.nativeMethods.set(
            "java/lang/System.currentTimeMillis()J",
            ()=>BigInt(Date.now())
        );

        this.nativeMethods.set(
            "java/lang/System.nanoTime()J",
            ()=>BigInt(performance.now()*1000000)
        );

        this.nativeMethods.set(
            "java/lang/Math.floor(F)F",
            x=>Math.floor(Number(x))
        );

        this.nativeMethods.set(
            "java/lang/Math.ceil(F)F",
            x=>Math.ceil(Number(x))
        );

        this.nativeMethods.set(
            "java/lang/Math.abs(I)I",
            x=>Math.abs(Number(x))
        );

        this.nativeMethods.set(
            "java/lang/Math.random()D",
            ()=>Math.random()
        );
    }

    findMethod(className,name,descriptor){

        let current=this.getClass(className);

        while(current){

            const m=current.definition.methods.find(
                x=>
                    x.name===name &&
                    x.descriptor===descriptor
            );

            if(m)
                return {
                    owner:current,
                    method:m
                };

            const parent=current.definition.superName;

            if(!parent)
                break;

            current=this.getClass(parent);
        }

        return null;
    }

    constant(classDef,index){

        const cp=classDef.constantPool[index];

        if(!cp)
            throw new Error(
                "Invalid constant pool index "+index
            );

        return cp;
    }

    cpUtf(classDef,index){

        const cp=this.constant(
            classDef,
            index
        );

        if(cp.tag===1)
            return cp.value;

        if(cp.tag===7)
            return this.cpUtf(
                classDef,
                cp.nameIndex
            );

        if(cp.tag===8)
            return this.cpUtf(
                classDef,
                cp.stringIndex
            );

        throw new Error(
            "Constant is not UTF8"
        );
    }

    cpClassName(classDef,index){

        return this.cpUtf(
            classDef,
            index
        );
    }

    cpNameType(classDef,index){

        const cp=this.constant(
            classDef,
            index
        );

        if(cp.tag!==12)
            throw new Error(
                "Expected NameAndType"
            );

        return {
            name:this.cpUtf(
                classDef,
                cp.a
            ),
            descriptor:this.cpUtf(
                classDef,
                cp.b
            )
        };
    }

    resolveField(classDef,index){

        const ref=this.constant(
            classDef,
            index
        );

        const owner=this.cpClassName(
            classDef,
            ref.a
        );

        const nt=this.cpNameType(
            classDef,
            ref.b
        );

        return {
            owner,
            name:nt.name,
            descriptor:nt.descriptor
        };
    }

    resolveMethod(classDef,index){

        const ref=this.constant(
            classDef,
            index
        );

        const owner=this.cpClassName(
            classDef,
            ref.a
        );

        const nt=this.cpNameType(
            classDef,
            ref.b
        );

        return {
            owner,
            name:nt.name,
            descriptor:nt.descriptor
        };
    }

    async initialize(className){

        const clazz=this.getClass(className);

        if(!clazz)
            return;

        if(clazz.initialized)
            return;

        if(clazz.initializing)
            return;

        clazz.initializing=true;

        const parent=clazz.definition.superName;

        if(parent)
            await this.initialize(parent);

        const clinit=clazz.definition.methods.find(
            m=>
                m.name==="<clinit>" &&
                m.descriptor==="()V"
        );

        if(clinit){

            log(
                "Initializing "+className+
                ".<clinit>()",
                "info"
            );

            await this.invoke(
                clazz,
                clinit,
                [],
                null
            );
        }

        clazz.initialized=true;
        clazz.initializing=false;
    }

    defaultValue(descriptor){

        if(
            descriptor==="I" ||
            descriptor==="Z" ||
            descriptor==="B" ||
            descriptor==="C" ||
            descriptor==="S" ||
            descriptor==="F" ||
            descriptor==="J" ||
            descriptor==="D"
        )
            return 0;

        return null;
    }

    getCode(method){

        const attr=method.attributes.find(
            a=>a.name==="Code"
        );

        return attr ? attr.value : null;
    }

    async invoke(clazz,method,args,thisObject){

        this.executedMethods++;

        $("executed").textContent=
            this.executedMethods;

        const code=this.getCode(method);

        if(!code){

            const key=
                clazz.definition.name+
                "/"+
                method.name+
                method.descriptor;

            const native=this.nativeMethods.get(key);

            if(native)
                return native(...args);

            /*
             * Native/abstract JVM methods that are not yet
             * implemented are allowed to return a safe value
             * while the VM is being brought up.
             */

            if(method.descriptor.endsWith("V"))
                return undefined;

            return null;
        }

        const locals=new Array(
            Math.max(
                code.maxLocals,
                args.length+(thisObject?1:0)
            )
        ).fill(null);

        let localIndex=0;

        if(!(method.flags&0x0008))
            locals[localIndex++]=thisObject;

        for(const arg of args)
            locals[localIndex++]=arg;

        const stack=[];

        const bytes=code.code;

        let pc=0;

        const readU1=()=>{
            return bytes[pc++];
        };

        const readS1=()=>{
            const v=bytes[pc++];
            return v&0x80 ? v-256 : v;
        };

        const readU2=()=>{
            const v=
                (bytes[pc]<<8)|
                bytes[pc+1];

            pc+=2;
            return v;
        };

        const readS2=()=>{
            const v=readU2();
            return v&0x8000
                ?v-65536
                :v;
        };

        const readS4=()=>{
            const v=
                (bytes[pc]<<24)|
                (bytes[pc+1]<<16)|
                (bytes[pc+2]<<8)|
                bytes[pc+3];

            pc+=4;

            return v|0;
        };

        const branch=offset=>{
            pc+=offset-3;
        };

        while(pc<bytes.length){

            this.instructionCounter++;

            if(
                this.instructionCounter>
                this.maxInstructions
            )
                throw new Error(
                    "VM instruction limit reached"
                );

            const op=readU1();

            switch(op){

                case 0x00:
                    break;

                case 0x01:
                    stack.push(null);
                    break;

                case 0x02:
                case 0x03:
                case 0x04:
                case 0x05:
                case 0x06:
                case 0x07:
                case 0x08:
                    stack.push(op-3);
                    break;

                case 0x09:
                case 0x0a:
                    stack.push(BigInt(op-9));
                    break;

                case 0x0b:
                case 0x0c:
                case 0x0d:
                    stack.push(op-0x0b);
                    break;

                case 0x10:
                    stack.push(readS1());
                    break;

                case 0x11:
                    stack.push(readS2());
                    break;

                case 0x12:
                    stack.push(
                        this.constant(
                            clazz.definition,
                            readU1()
                        ).value ?? null
                    );
                    break;

                case 0x13:
                case 0x14:
                    stack.push(
                        this.constant(
                            clazz.definition,
                            readU2()
                        ).value ?? null
                    );
                    break;

                case 0x15:
                case 0x16:
                case 0x17:
                case 0x18:
                case 0x19:
                    stack.push(
                        locals[readU1()]
                    );
                    break;

                case 0x1a:
                case 0x1b:
                case 0x1c:
                case 0x1d:
                    stack.push(
                        locals[op-0x1a]
                    );
                    break;

                case 0x2a:
                case 0x2b:
                case 0x2c:
                case 0x2d:
                    stack.push(
                        locals[op-0x2a]
                    );
                    break;

                case 0x36:
                case 0x37:
                case 0x38:
                case 0x39:
                case 0x3a:
                    locals[readU1()]=stack.pop();
                    break;

                case 0x3b:
                case 0x3c:
                case 0x3d:
                case 0x3e:
                    locals[op-0x3b]=stack.pop();
                    break;

                case 0x4b:
                case 0x4c:
                case 0x4d:
                case 0x4e:
                    locals[op-0x4b]=stack.pop();
                    break;

                case 0x57:
                    stack.pop();
                    break;

                case 0x59:{
                    const a=stack.pop();
                    stack.push(a,a);
                    break;
                }

                case 0x60:{
                    const b=Number(stack.pop());
                    const a=Number(stack.pop());
                    stack.push((a+b)|0);
                    break;
                }

                case 0x61:{
                    const b=BigInt(stack.pop());
                    const a=BigInt(stack.pop());
                    stack.push(a+b);
                    break;
                }

                case 0x64:{
                    const b=Number(stack.pop());
                    const a=Number(stack.pop());
                    stack.push((a-b)|0);
                    break;
                }

                case 0x65:{
                    const b=BigInt(stack.pop());
                    const a=BigInt(stack.pop());
                    stack.push(a-b);
                    break;
                }

                case 0x68:{
                    const b=Number(stack.pop());
                    const a=Number(stack.pop());
                    stack.push(Math.imul(a,b));
                    break;
                }

                case 0x6c:{
                    const b=Number(stack.pop());
                    const a=Number(stack.pop());

                    if(b===0)
                        throw new Error(
                            "ArithmeticException: / by zero"
                        );

                    stack.push(
                        Math.trunc(a/b)|0
                    );
                    break;
                }

                case 0x70:{
                    const b=Number(stack.pop());
                    const a=Number(stack.pop());

                    if(b===0)
                        throw new Error(
                            "ArithmeticException: % by zero"
                        );

                    stack.push(a%b);
                    break;
                }

                case 0x74:
                    stack.push(
                        -Number(stack.pop())
                    );
                    break;

                case 0x78:{
                    const b=Number(stack.pop())&31;
                    const a=Number(stack.pop());
                    stack.push(a<<b);
                    break;
                }

                case 0x7a:{
                    const b=Number(stack.pop())&31;
                    const a=Number(stack.pop());
                    stack.push(a>>b);
                    break;
                }

                case 0x7e:{
                    const b=Number(stack.pop());
                    const a=Number(stack.pop());
                    stack.push(a&b);
                    break;
                }

                case 0x80:{
                    const b=Number(stack.pop());
                    const a=Number(stack.pop());
                    stack.push(a|b);
                    break;
                }

                case 0x82:{
                    const b=Number(stack.pop());
                    const a=Number(stack.pop());
                    stack.push(a^b);
                    break;
                }

                case 0x84:{
                    const index=readU1();
                    const amount=readS1();

                    locals[index]=
                        (Number(locals[index])+amount)|0;
                    break;
                }

                case 0x85:
                    stack.push(
                        Number(stack.pop())
                    );
                    break;

                case 0x86:
                    stack.push(
                        Number(stack.pop())
                    );
                    break;

                case 0x87:
                    stack.push(
                        Number(stack.pop())
                    );
                    break;

                case 0x88:
                    stack.push(
                        Number(stack.pop())|0
                    );
                    break;

                case 0x91:
                case 0x92:
                case 0x93:
                    stack.push(
                        Number(stack.pop())|0
                    );
                    break;

                case 0x94:{
                    const b=BigInt(stack.pop());
                    const a=BigInt(stack.pop());

                    stack.push(
                        a>b?1:a<b?-1:0
                    );

                    break;
                }

                case 0x99:{
                    const value=Number(stack.pop());
                    const offset=readS2();

                    if(value===0)
                        branch(offset);

                    break;
                }

                case 0x9a:{
                    const value=Number(stack.pop());
                    const offset=readS2();

                    if(value!==0)
                        branch(offset);

                    break;
                }

                case 0x9b:{
                    const value=Number(stack.pop());
                    const offset=readS2();

                    if(value<0)
                        branch(offset);

                    break;
                }

                case 0x9c:{
                    const value=Number(stack.pop());
                    const offset=readS2();

                    if(value>=0)
                        branch(offset);

                    break;
                }

                case 0x9d:{
                    const value=Number(stack.pop());
                    const offset=readS2();

                    if(value>0)
                        branch(offset);

                    break;
                }

                case 0x9e:{
                    const value=Number(stack.pop());
                    const offset=readS2();

                    if(value<=0)
                        branch(offset);

                    break;
                }

                case 0x9f:{
                    const b=stack.pop();
                    const a=stack.pop();
                    const offset=readS2();

                    if(a===b)
                        branch(offset);

                    break;
                }

                case 0xa0:{
                    const b=stack.pop();
                    const a=stack.pop();
                    const offset=readS2();

                    if(a!==b)
                        branch(offset);

                    break;
                }

                case 0xa1:{
                    const b=Number(stack.pop());
                    const a=Number(stack.pop());
                    const offset=readS2();

                    if(a<b)
                        branch(offset);

                    break;
                }

                case 0xa2:{
                    const b=Number(stack.pop());
                    const a=Number(stack.pop());
                    const offset=readS2();

                    if(a>=b)
                        branch(offset);

                    break;
                }

                case 0xa3:{
                    const b=Number(stack.pop());
                    const a=Number(stack.pop());
                    const offset=readS2();

                    if(a>b)
                        branch(offset);

                    break;
                }

                case 0xa4:{
                    const b=Number(stack.pop());
                    const a=Number(stack.pop());
                    const offset=readS2();

                    if(a<=b)
                        branch(offset);

                    break;
                }

                case 0xa7:{
                    const offset=readS2();
                    branch(offset);
                    break;
                }

                case 0xac:
                case 0xad:
                case 0xae:
                case 0xaf:
                case 0xb0:
                case 0xb1:
                    return method.descriptor.endsWith("V")
                        ?undefined
                        :stack.pop();

                case 0xb2:{
                    const index=readU2();

                    const field=
                        this.resolveField(
                            clazz.definition,
                            index
                        );

                    const owner=
                        this.getClass(field.owner);

                    if(!owner)
                        throw new Error(
                            "Missing class "+field.owner
                        );

                    const key=
                        field.name+
                        ":"+
                        field.descriptor;

                    if(!owner.staticFields.has(key))
                        owner.staticFields.set(
                            key,
                            this.defaultValue(
                                field.descriptor
                            )
                        );

                    stack.push(
                        owner.staticFields.get(key)
                    );

                    break;
                }

                case 0xb3:{
                    const index=readU2();

                    const value=stack.pop();

                    const field=
                        this.resolveField(
                            clazz.definition,
                            index
                        );

                    const owner=
                        this.getClass(field.owner);

                    if(owner){

                        owner.staticFields.set(
                            field.name+":"+field.descriptor,
                            value
                        );
                    }

                    break;
                }

                case 0xb4:{
                    const index=readU2();

                    const field=
                        this.resolveField(
                            clazz.definition,
                            index
                        );

                    const object=stack.pop();

                    if(!object){

                        stack.push(null);
                        break;
                    }

                    stack.push(
                        object.fields.get(
                            field.name+":"+field.descriptor
                        ) ?? null
                    );

                    break;
                }

                case 0xb5:{
                    const index=readU2();

                    const value=stack.pop();
                    const object=stack.pop();

                    if(object){

                        const field=
                            this.resolveField(
                                clazz.definition,
                                index
                            );

                        object.fields.set(
                            field.name+":"+field.descriptor,
                            value
                        );
                    }

                    break;
                }

                case 0xb6:
                case 0xb7:
                case 0xb8:
                case 0xb9:{

                    const index=readU2();

                    if(op===0xb9)
                        readU2();

                    const ref=
                        this.resolveMethod(
                            clazz.definition,
                            index
                        );

                    const parsed=
                        parseMethodDescriptor(
                            ref.descriptor
                        );

                    const callArgs=[];

                    for(let i=parsed.args.length-1;i>=0;i--)
                        callArgs.unshift(
                            stack.pop()
                        );

                    let receiver=null;

                    if(op!==0xb8)
                        receiver=stack.pop();

                    const target=
                        this.findMethod(
                            ref.owner,
                            ref.name,
                            ref.descriptor
                        );

                    if(!target){

                        const key=
                            ref.owner+
                            "/"+
                            ref.name+
                            ref.descriptor;

                        const native=
                            this.nativeMethods.get(key);

                        if(native){

                            const result=
                                native(
                                    ...callArgs
                                );

                            if(
                                parsed.returnType!=="void"
                            )
                                stack.push(result);

                            break;
                        }

                        /*
                         * Java library methods will progressively
                         * be filled in here.
                         */
                        if(
                            parsed.returnType!=="void"
                        )
                            stack.push(null);

                        break;
                    }

                    const result=
                        await this.invoke(
                            target.owner,
                            target.method,
                            callArgs,
                            receiver
                        );

                    if(
                        parsed.returnType!=="void"
                    )
                        stack.push(result);

                    break;
                }

                case 0xbb:{
                    const index=readU2();

                    const name=
                        this.cpClassName(
                            clazz.definition,
                            index
                        );

                    stack.push(
                        new JVMObject(name)
                    );

                    break;
                }

                case 0xbc:{
                    const atype=readU1();
                    const length=Number(stack.pop());

                    const array=
                        new JVMArray(
                            atype,
                            length
                        );

                    stack.push(array);

                    break;
                }

                case 0xbd:{
                    const index=readU2();

                    const type=
                        this.cpClassName(
                            clazz.definition,
                            index
                        );

                    const length=Number(stack.pop());

                    stack.push(
                        new JVMArray(
                            type,
                            length
                        )
                    );

                    break;
                }

                case 0xbe:{
                    const array=stack.pop();

                    stack.push(
                        array?.values?.length || 0
                    );

                    break;
                }

                case 0xbf:{
                    const throwable=stack.pop();

                    throw new Error(
                        "Java exception: "+
                        (
                            throwable?.className ||
                            "Throwable"
                        )
                    );
                }

                case 0xc0:{
                    readU2();
                    break;
                }

                case 0xc1:{
                    readU2();
                    stack.push(0);
                    break;
                }

                case 0xc6:{
                    const offset=readS2();
                    const value=stack.pop();

                    if(value===null)
                        branch(offset);

                    break;
                }

                case 0xc7:{
                    const offset=readS2();
                    const value=stack.pop();

                    if(value!==null)
                        branch(offset);

                    break;
                }

                case 0xc8:{
                    const offset=readS4();
                    pc+=offset-5;
                    break;
                }

                case 0x57:
                    stack.pop();
                    break;

                default:

                    /*
                     * Unsupported opcodes are reported precisely.
                     * The VM does not emit invalid WASM anymore.
                     */

                    throw new Error(
                        "Unsupported JVM opcode 0x"+
                        op.toString(16).padStart(2,"0")+
                        " in "+
                        clazz.definition.name+
                        "."+
                        method.name+
                        method.descriptor+
                        " at bytecode offset "+
                        (pc-1)
                    );
            }
        }

        return undefined;
    }

    async launch(){

        log("Searching for Minecraft entry point...");

        const candidates=[];

        for(const [name,clazz] of this.classes){

            for(const method of clazz.definition.methods){

                if(
                    method.name==="main" &&
                    method.descriptor===
                    "([Ljava/lang/String;)V"
                ){

                    candidates.push({
                        clazz,
                        method
                    });
                }
            }
        }

        log(
            "Found "+candidates.length+
            " standard main(String[]) method(s).",
            candidates.length?"ok":"warn"
        );

        /*
         * Vanilla Minecraft 1.2.5's actual client startup
         * is not reliably identified solely by main().
         *
         * Search for likely Minecraft classes as well.
         */

        const likely=[
            "net/minecraft/client/Minecraft",
            "Minecraft",
            "net/minecraft/client/MinecraftApplet"
        ];

        let target=null;

        for(const name of likely){

            if(this.getClass(name)){
                target=this.getClass(name);
                break;
            }
        }

        if(!target && candidates.length)
            target=candidates[0].clazz;

        if(!target)
            throw new Error(
                "Could not locate a Minecraft startup class."
            );

        this.mainClass=target.definition.name;

        log(
            "Startup candidate: "+
            this.mainClass,
            "ok"
        );

        await this.initialize(
            this.mainClass
        );

        const main=
            target.definition.methods.find(
                m=>
                    m.name==="main" &&
                    m.descriptor===
                    "([Ljava/lang/String;)V"
            );

        if(main){

            log(
                "Invoking "+
                this.mainClass+
                ".main(String[])"
            );

            const args=
                new JVMArray(
                    "[Ljava/lang/String;",
                    0
                );

            await this.invoke(
                target,
                main,
                [args],
                null
            );

            return;
        }

        /*
         * If the class has no main(), attempt a Minecraft-style
         * construction path.
         */
        const ctor=
            target.definition.methods.find(
                m=>
                    m.name==="<init>"
            );

        if(ctor){

            log(
                "Attempting constructor startup..."
            );

            const object=
                new JVMObject(
                    target.definition.name
                );

            const descriptor=
                parseMethodDescriptor(
                    ctor.descriptor
                );

            const args=
                descriptor.args.map(
                    ()=>null
                );

            await this.invoke(
                target,
                ctor,
                args,
                object
            );
        }
    }
}

/* =========================================================
   Application state
========================================================= */

let currentFile=null;
let jar=null;
let vm=null;
let classCount=0;
let methodCount=0;

/* =========================================================
   File loading
========================================================= */

async function loadFile(file){

    if(!file)
        return;

    currentFile=file;

    $("jarStatus").textContent="Loading...";
    $("jarSize").textContent=
        (file.size/1024/1024).toFixed(2)+" MB";

    $("launch").disabled=true;

    $("console").innerHTML="";

    progress(2);

    log(
        "Loading: "+file.name
    );

    try{

        const buffer=
            await file.arrayBuffer();

        progress(10);

        log(
            "Size: "+
            (buffer.byteLength/1024/1024).toFixed(2)+
            " MB"
        );

        jar=
            await openJar(buffer);

        progress(20);

        log(
            "JAR opened successfully: "+
            jar.files.size+
            " entries",
            "ok"
        );

        $("entries").textContent=
            jar.files.size;

        const classFiles=
            [...jar.files.keys()]
            .filter(
                name=>
                    name.endsWith(".class") &&
                    !name.endsWith("module-info.class")
            );

        classCount=classFiles.length;

        $("classes").textContent=
            classCount;

        log(
            "Found "+
            classCount+
            " class files."
        );

        vm=new JVM();

        let parsed=0;

        for(const name of classFiles){

            try{

                const data=
                    await jar.extract(name);

                const definition=
                    parseClass(data);

                vm.addClass(definition);

                methodCount+=
                    definition.methods.length;

                parsed++;

                if(
                    parsed%25===0 ||
                    parsed===classFiles.length
                ){

                    const pct=
                        20+
                        (parsed/classFiles.length)*65;

                    progress(pct);

                    $("parsed").textContent=
                        parsed;
                }

            }catch(error){

                log(
                    "Could not parse "+
                    name+
                    ": "+
                    error.message,
                    "warn"
                );
            }
        }

        $("methods").textContent=
            methodCount;

        $("parsed").textContent=
            parsed;

        $("loaded").textContent=
            vm.classes.size;

        progress(90);

        log(
            "JAR analysis complete. Parsed "+
            parsed+
            " classes.",
            "ok"
        );

        /*
         * Report main methods.
         */
        let mains=0;

        for(const clazz of vm.classes.values()){

            for(const m of clazz.definition.methods){

                if(
                    m.name==="main" &&
                    m.descriptor===
                    "([Ljava/lang/String;)V"
                )
                    mains++;
            }
        }

        log(
            "Found "+
            mains+
            " standard main(String[]) method(s).",
            mains?"ok":"warn"
        );

        $("jarStatus").textContent="Ready";

        $("launch").disabled=false;

        progress(100);

    }catch(error){

        $("jarStatus").textContent="Error";

        log(
            "JAR loading failed: "+
            error.message,
            "error"
        );

        console.error(error);

        progress(0);
    }
}

/* =========================================================
   Minecraft screen
========================================================= */

async function showLoadingScreen(){

    $("overlay").classList.add("visible");

    const fill=$("loadingFill");

    fill.style.width="0%";

    for(let i=0;i<=100;i++){

        fill.style.width=i+"%";

        await sleep(8);
    }
}

/* =========================================================
   Launch
========================================================= */

async function launch(){

    if(!vm)
        return;

    $("launch").disabled=true;

    try{

        log(
            "Starting JVM..."
        );

        await showLoadingScreen();

        log(
            "Initializing Minecraft classes..."
        );

        await vm.launch();

        log(
            "Minecraft startup returned.",
            "ok"
        );

    }catch(error){

        log(
            "JVM execution stopped: "+
            error.message,
            "error"
        );

        console.error(error);

        /*
         * Leave the loading screen visible so it is clear
         * exactly how far startup got.
         */
    }finally{

        $("launch").disabled=false;
    }
}

        const file=e.target.files[0];

        if(file)
            loadFile(file);
    }
);

$("launch").addEventListener(
    "click",
    launch
);

const drop=$("drop");

drop.addEventListener(
    "dragover",
    e=>{
        e.preventDefault();
        drop.classList.add("drag");
    }
);

drop.addEventListener(
    "dragleave",
    ()=>{
        drop.classList.remove("drag");
    }
);

drop.addEventListener(
    "drop",
    e=>{
        e.preventDefault();

        drop.classList.remove("drag");

        const file=
            e.dataTransfer.files[0];

        if(file)
            loadFile(file);
    }
);

/* =========================================================
   Canvas placeholder
========================================================= */

const canvas=$("canvas");
const ctx=canvas.getContext("2d");

function drawIdle(){

    ctx.fillStyle="#000";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle="#222";
    ctx.font="16px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "Minecraft JVM",
        canvas.width/2,
        canvas.height/2
    );

    ctx.font="12px Arial";
    ctx.fillStyle="#555";

    ctx.fillText(
        "Load client.jar to begin",
        canvas.width/2,
        canvas.height/2+25
    );
}

drawIdle();

log(
    "Browser JVM ready."
);
</script>
